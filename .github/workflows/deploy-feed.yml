name: Deploy Winget Feed

on:
  push:
    branches: [main]
    paths:
      - "source.json"
      - "index.json"
      - "index.html"
      - "staticwebapp.config.json"
      - "api/**"
      - "manifests/**"
      - "packageManifests/**"
      - "scripts/prepare_site.ps1"
      - "scripts/register-source.ps1"
      - ".github/workflows/deploy-feed.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Test REST source helper
        env:
          WINGET_DATA_ROOT: ${{ github.workspace }}
        run: npm --prefix api test

      - name: Prepare site payload
        shell: pwsh
        run: ./scripts/prepare_site.ps1

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: _site
          api_location: api
          skip_app_build: true
