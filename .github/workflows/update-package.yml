name: Update Package

on:
  repository_dispatch:
    types: [update-package]
  workflow_dispatch:
    inputs:
      package_key:
        description: Package key in packages/
        required: true
      version:
        description: Package version
        required: true
      installer_url:
        description: MSI download URL
        required: true
      sha256:
        description: Installer SHA256
        required: true
      product_code:
        description: MSI ProductCode
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PACKAGE_KEY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.package_key || inputs.package_key }}
      PACKAGE_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.version || inputs.version }}
      INSTALLER_URL: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.installer_url || inputs.installer_url }}
      INSTALLER_SHA256: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha256 || inputs.sha256 }}
      PRODUCT_CODE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.product_code || inputs.product_code }}
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Update package manifests
        run: |
          python scripts/update_package.py \
            "$PACKAGE_KEY" \
            "$PACKAGE_VERSION" \
            "$INSTALLER_URL" \
            "$INSTALLER_SHA256" \
            "$PRODUCT_CODE"

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="automation/update-${PACKAGE_KEY}-${PACKAGE_VERSION}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add index.json manifests packageManifests
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update $PACKAGE_KEY to $PACKAGE_VERSION"
          git push --set-upstream origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open package update pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.MTG_WINGET_PR_TOKEN }}
          UPDATE_BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "MTG_WINGET_PR_TOKEN is required because GitHub Actions cannot create pull requests with GITHUB_TOKEN in this repository."
            exit 1
          fi
          gh pr create \
            --base main \
            --head "$UPDATE_BRANCH" \
            --title "Update $PACKAGE_KEY to $PACKAGE_VERSION" \
            --body "Generated WinGet manifests for $PACKAGE_KEY $PACKAGE_VERSION."
